name: Build and publish debugger packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both validated packages to NuGet.org
        type: boolean
        default: false
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: debugger-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate core debugger behavior
        run: dotnet run --project tests/ProjectZ/ProjectZ.Tests.csproj -c Release
      - name: Build WPF and native Project-Z tools
        run: dotnet build heirowDebug.WPF.sln -c Release -m:1 -p:ContinuousIntegrationBuild=true -p:GeneratePackageOnBuild=false
      - name: Pack both debugger libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($project in @('heirowDebug.WPF.vbproj', 'heirowDebug.ProjectZ/heirowDebug.ProjectZ.csproj')) {
            dotnet pack $project -c Release -o artifacts/nuget -p:ContinuousIntegrationBuild=true -p:GeneratePackageOnBuild=false -p:DebugType=None -p:DebugSymbols=false
            if ($LASTEXITCODE -ne 0) { throw "Pack failed: $project" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          foreach ($id in @('heirowDebug.WPF', 'heirowDebug.ProjectZ')) {
            $package = "artifacts/nuget/$id.$version.nupkg"
            $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $package))
            try {
              $names = @($zip.Entries.FullName)
              if (-not ($names -match "^lib/.+/$([regex]::Escape($id)).dll$")) { throw "Library missing in $id" }
              if ($names -match '(?i)(^|/)(\.vs|obj|bin|artifacts|\.codex|\.chatgpt)/|\.(jsonl|log|ps1|pfx|p12|pem|key)$|clipboard') { throw "Forbidden package entry in $id" }
              if (-not ($names -contains 'README.md')) { throw "Readme missing in $id" }
              $reader = [IO.StreamReader]::new($zip.GetEntry('README.md').Open())
              try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
              if ($readme -match '(?i)\.ps1\b|publish-nuget|NUGET_USER|trusted publishing|publishing setup') { throw "Internal publishing details in $id readme" }
            }
            finally { $zip.Dispose() }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: debugger-nuget
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debugger-nuget
          path: packages
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish heirowDebug.WPF and heirowDebug.ProjectZ
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem packages/*.nupkg)
          if ($packages.Count -ne 2) { throw 'Expected exactly two debugger packages.' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed: $($package.Name)" }
          }
